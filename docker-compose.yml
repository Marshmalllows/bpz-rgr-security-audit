name: bpz-rgr

networks:
  lab:
    internal: true
  edge: {}

services:
  bwapp-vuln:
    image: raesene/bwapp:latest
    networks: [lab]

  bwapp-fixed:
    build: ./target
    image: bpz-rgr/bwapp-fixed:latest
    networks: [lab]

  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    networks: [lab, edge]
    depends_on: [bwapp-vuln, bwapp-fixed]
