events {}

http {
    server {
        listen 8080;
        location / {
            proxy_pass http://bwapp-vuln:80;
            proxy_set_header Host $http_host;
        }
    }

    server {
        listen 8081;
        location / {
            proxy_pass http://bwapp-fixed:80;
            proxy_set_header Host $http_host;
        }
    }
}
